[package]
name = "rustfetch"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "rustfetch"
path = "src/main.rs"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.5.59", features = ["derive"] }
colored = "3.1.1"
directories = "6.0.0"
dirs = "6.0.0"
display-info = "0.5.7"
pollster = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
shellver = "2.0.1"
sysinfo = "0.37.2"
toml = "0.9.12"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.22"
unicode-width = "0.2.2"
wgpu = "28.0.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"
